name: Tests

on:
push:
branches:
- main
- develop
pull_request:
branches:
- main
- develop

jobs:
tests:
runs-on: ubuntu-latest

```
services:
  postgres:
    image: postgres:17
    env:
      POSTGRES_DB: crypto_etl_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    options: --health-cmd="pg_isready -U postgres -d crypto_etl_test" --health-interval=10s --health-timeout=5s --health-retries=5

env:
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/crypto_etl_test"
  POSTGRES_HOST: "localhost"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "crypto_etl_test"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.13"
      cache: pip

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest

  - name: Run tests
    run: python -m pytest tests -v
```
